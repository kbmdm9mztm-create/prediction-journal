<!DOCTYPE html>
<html>
<head>
  <title>Prediction Journal</title>
</head>
<body>
  <h1>Prediction Journal</h1>
  <input id="text" placeholder="What do you predict?">
  <input id="confidence" type="number" value="70" min="50" max="100">
  <button id="add">Add</button>
  <ul id="list"></ul>
  <p id="score"></p>

  <script>
    const textBox = document.getElementById("text");
    const confBox = document.getElementById("confidence");
    const addBtn = document.getElementById("add");
    const list = document.getElementById("list");
    const scoreText = document.getElementById("score");

    const predictions = [];

    // NEW: sets the result of one prediction, then redraws
    function setResult(index, result) {
      predictions[index].result = result;
      render();
    }

    function render() {
      list.innerHTML = "";
      predictions.forEach(function (p, index) {          // NEW: forEach gives us the position (index) too
        const item = document.createElement("li");
        const status = p.result === null ? "pending" : p.result;
        item.textContent = p.text + " (" + p.confidence + "% sure) - " + status + " ";

        if (p.result === null) {                         // NEW: only show buttons if not answered yet
          const rightBtn = document.createElement("button");
          rightBtn.textContent = "Right";
          rightBtn.addEventListener("click", function () { setResult(index, "right"); });

          const wrongBtn = document.createElement("button");
          wrongBtn.textContent = "Wrong";
          wrongBtn.addEventListener("click", function () { setResult(index, "wrong"); });

          item.append(rightBtn, wrongBtn);
        }

        list.appendChild(item);
      });

      // NEW: work out the score
      const answered = predictions.filter(p => p.result !== null);
      const right = answered.filter(p => p.result === "right");
      if (answered.length === 0) {
        scoreText.textContent = "No results yet.";
      } else {
        const percent = Math.round(right.length / answered.length * 100);
        scoreText.textContent = "Right " + right.length + " of " + answered.length + " (" + percent + "%)";
      }
    }

    addBtn.addEventListener("click", function () {
      if (textBox.value === "") return;
      if (Number(confBox.value) < 50 || Number(confBox.value) > 100) return;

      predictions.push({
        text: textBox.value,
        confidence: Number(confBox.value),
        result: null,
      });
      render();
    });

    render();                                            // NEW: draw once at the start so the score line shows
  </script>
</body>
</html>
